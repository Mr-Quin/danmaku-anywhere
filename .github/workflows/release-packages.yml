name: Release Shared Libraries

on:
  workflow_dispatch:

concurrency:
  group: release-packages
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 26.x
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build libraries
        run: pnpm --filter '@danmaku-anywhere/danmaku-model...' --filter '@danmaku-anywhere/extension-protocol...' build

      # pnpm pack turns workspace:^ into a real version range and applies
      # publishConfig; npm publish then authenticates through OIDC.
      - name: Publish versions missing from npm
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/packs"
          mkdir -p "$out"
          for dir in packages/danmaku-model packages/extension-protocol; do
            name=$(jq -r .name "$dir/package.json")
            version=$(jq -r .version "$dir/package.json")
            if lookup=$(npm view "$name@$version" version 2>&1); then
              echo "$name@$version is already on npm"
              continue
            fi
            if ! grep -q E404 <<<"$lookup"; then
              echo "$lookup"
              exit 1
            fi
            tarball="$out/$(basename "$dir").tgz"
            (cd "$dir" && pnpm pack --out "$tarball")
            npm publish "$tarball" --access public
          done
